# Personal fork build: push to the default branch -> signed APK -> GitHub Release.
#
# Fork of matthew777777/RawLens (GPL-3.0-or-later). The application code is upstream's;
# this workflow only builds, signs and publishes it.
#
# What it does:
#   1. runs the zoom-crop unit tests (the one piece of new logic this fork adds);
#   2. :app:assembleRelease -> UNSIGNED, minified APK;
#   3. zipalign -P 16 (16 KB page alignment for the bundled .so) then apksigner with
#      v1 (JAR) AND v2 AND v3 all forced on;
#   4. verifies all three schemes at --min-sdk-version 18 (below 24 is what makes
#      apksigner actually check the v1 JAR signature) and prints the signer;
#   5. uploads the APK as a workflow artifact and attaches it to a Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE           base64 of the release keystore (.jks)
#   SIGNING_KEY_ALIAS          keystore alias
#   SIGNING_KEYSTORE_PASSWORD  store password
#   SIGNING_KEY_PASSWORD       key password (same as the store password for PKCS12)
#
# Toolchain notes, all from app/build.gradle.kts:
#   AGP 9.4.1 / Gradle 9.8.2, compileSdk 37, ndkVersion 27.0.12077973, minSdk 29,
#   targetSdk 35, arm64-v8a + armeabi-v7a only.
#   The build compiles Vulkan shaders with the NDK's own glslc and runs python3
#   generator scripts, so both must be present on the runner.
#   gradle/gradle-daemon-jvm.properties pins the daemon toolchain to 27; the runner
#   installs 21 (sourceCompatibility is 21), so the criteria are lowered for the run
#   only -- the file in the repository is left untouched.
name: Build

on:
  push:
    branches: [refactor/2.0, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rawlens-signed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + sign (v1/v2/v3) + publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # third_party/libjxl is a submodule; without it the JXL DNG path falls back to
          # CMake fetching a pinned release, which needs network the runner may not give it.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.0.12077973 cmake;3.22.1 build-tools;36.0.0 platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Python for the shader generators
        run: python3 --version

      - name: Lower the pinned daemon toolchain for this run
        run: |
          set -euo pipefail
          echo "before: $(cat gradle/gradle-daemon-jvm.properties)"
          sed -i 's/^toolchainVersion=.*/toolchainVersion=21/' gradle/gradle-daemon-jvm.properties
          echo "after:  $(cat gradle/gradle-daemon-jvm.properties)"

      # Two distribution flavors, so every task name carries one: the fork ships the
      # `github` flavor (update check on, F-Droid build would pin and strip it).
      - name: Zoom unit tests (crop geometry + track scale)
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testGithubDebugUnitTest \
            --tests "com.matthew.rawlens.ZoomCropTest" \
            --tests "com.matthew.rawlens.ZoomStopsTest" \
            --stacktrace

      # This project signs its own release output: with RAWLENS_KEYSTORE set,
      # app/build.gradle.kts uses the `releaseEnv` signing config, otherwise it falls back
      # to the debug key so a fresh clone stays installable. So the APK here is signed by
      # design -- the first attempt of this workflow assumed "*-unsigned.apk" and failed
      # twice on that assumption, once on the name and once on a guard that asserted the
      # build produced nothing signed. Sign with our key *in* Gradle, then add v1 below.
      - name: Assemble release with this fork's key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RAWLENS_KEYSTORE: ${{ runner.temp }}/fork-signing-${{ github.run_id }}.jks
          RAWLENS_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RAWLENS_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          RAWLENS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE:?secret SIGNING_KEYSTORE is empty or missing}"
          chmod +x ./gradlew
          ( umask 077; printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RAWLENS_KEYSTORE" )
          test -s "$RAWLENS_KEYSTORE"
          ./gradlew :app:assembleGithubRelease --stacktrace

          echo "--- what was produced ---"
          find app/build/outputs/apk -type f -name '*.apk' -printf '%10s  %p\n' | sort -k2
          # The release directory holds per-ABI splits (-arm64-v8a, -armeabi-v7a) as well
          # as the plain version-named universal APK, which is the one that installs
          # anywhere.
          APK="$(find app/build/outputs/apk/github/release -maxdepth 1 -type f \
            -name 'RawLens-*-release.apk' | head -1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::assembleGithubRelease produced no universal APK"
            exit 1
          fi
          echo "universal APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          BT="$ANDROID_HOME/build-tools/36.0.0"
          EXPECTED="$(keytool -list -v -keystore "$RAWLENS_KEYSTORE" \
            -storepass "$RAWLENS_KEYSTORE_PASSWORD" -alias "$RAWLENS_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          ACTUAL="$("$BT/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "expected signer: $EXPECTED"
          echo "actual signer:   $ACTUAL"
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"
          "$BT/aapt" dump badging "$APK" \
            | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:"

      - name: Force the v1 (JAR) signature and verify all three schemes
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS: ${{ runner.temp }}/fork-signing-${{ github.run_id }}.jks
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="$APK_PATH"
          test -f "$APK"
          test -s "$KS"
          VERSION_NAME="$("$BT/aapt" dump badging "$APK" \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$VERSION_NAME"
          NAME="RawLens-fork-${VERSION_NAME}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out

          # AGP only enables v1 when minSdk < 24 (this app is 29), so re-sign with the
          # SAME key to add the JAR signature: same signer, extra scheme, nothing else
          # changes. Alignment first, because a signature covers the aligned bytes.
          "$BT/zipalign" -f -P 16 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --min-sdk-version 29 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "out/$NAME" out/aligned.apk

          "$BT/zipalign" -c -v -P 16 4 "out/$NAME"
          "$BT/apksigner" verify --verbose --print-certs \
            --min-sdk-version 18 "out/$NAME" | tee out/verify.txt

          grep -q "Verified using v1 scheme (JAR signing): true" out/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" out/verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" out/verify.txt
          grep -q "^Number of signers: 1$" out/verify.txt
          unzip -l "out/$NAME" | grep -q "META-INF/.*\.RSA"

          VERSION_CODE="$("$BT/aapt" dump badging "out/$NAME" \
            | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          APK_SHA256="$(sha256sum "out/$NAME" | cut -d' ' -f1)"
          {
            echo "versionName: $VERSION_NAME"
            echo "versionCode: $VERSION_CODE"
            echo "run: $GITHUB_RUN_NUMBER"
            echo "commit: $GITHUB_SHA"
            echo "signing: v1 (JAR) + v2 + v3, all verified at --min-sdk-version 18"
          } > out/BUILD_INFO.txt
          sha256sum "out/$NAME" > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt
          {
            echo "SIGNED_APK=out/$NAME"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "APK_SHA256=$APK_SHA256"
          } >> "$GITHUB_ENV"

      - name: Signing material cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP"/fork-signing-*.jks
          if git ls-files --others --exclude-standard -- '*.jks' '*.keystore' keystore.properties | grep -q .; then
            echo "::error::Signing material leaked into the workspace"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rawlens-fork-${{ github.run_number }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            out/BUILD_INFO.txt
            out/verify.txt
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork.${{ github.run_number }}
          name: RawLens fork build ${{ github.run_number }} (v${{ env.VERSION_NAME }})
          body: |
            Personal fork build of [RawLens](https://github.com/matthew777777/RawLens) (GPL-3.0-or-later).

            * versionName `${{ env.VERSION_NAME }}`, versionCode `${{ env.VERSION_CODE }}`
            * workflow run `${{ github.run_number }}`, commit `${{ github.sha }}`
            * signed v1 (JAR) + v2 + v3, all verified by `apksigner`
            * `zipalign -P 16` (16 KB page aligned)

            Verify the download before installing:

            ```
            ${{ env.APK_SHA256 }}
            ```
          files: |
            ${{ env.SIGNED_APK }}
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
